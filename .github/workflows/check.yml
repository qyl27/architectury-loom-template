name: Build check

on:
  push:
    paths:
      - src/**/*
      - neoforge/**/*
      - fabric/**/*
      - build.gradle
      - gradle.properties
      - settings.gradle
  pull_request:
    paths:
      - src/**/*
      - neoforge/**/*
      - fabric/**/*
      - build.gradle
      - gradle.properties
      - settings.gradle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      mod-release: false
      upload-artifacts: false
