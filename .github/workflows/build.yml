name: Build

on:
  workflow_call:
    inputs:
      mod-release:
        required: true
        type: boolean
        default: true
      upload-artifacts:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      mod-release:
        required: true
        type: boolean
        default: false
        description: Release mode
      upload-artifacts:
        required: true
        type: boolean
        default: true
        description: Upload build artifacts

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build with Gradle
        env:
          MOD_RELEASE: ${{ inputs.mod-release }}
          MOD_CI: true
          MOD_CI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: inputs.upload-artifacts
        with:
          name: 'build'
          path: |
            build/libs
            fabric/build/libs
            neoforge/build/libs
          retention-days: 7