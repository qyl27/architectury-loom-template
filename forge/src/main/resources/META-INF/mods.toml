modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
issueTrackerURL = "https://github.com/qyl27/architectury-loom-template/issues"
license = "CC BY 4.0"
#clientSideOnly=true

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Example Mod"
authors = "Me!"
description = '''
Start to make your fantastic Minecraft Mod!
'''
#displayTest="MATCH_VERSION"

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
mandatory = true
versionRange = "${forge_minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

#[features.${mod_id}]
#openGLVersion="[3.2,)"
